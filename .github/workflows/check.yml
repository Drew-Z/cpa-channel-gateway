name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:public
      - run: npm test
      - run: npm run check:admin-dist
      - run: node --check index.js
      - run: node --check scripts/gateway.mjs
      - run: node --check scripts/install-runtime.mjs
